x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env
  environment:
    DB_HOST: db
    REDIS_HOST: queue
    S3_ENDPOINT: http://storage:9000
  init: true

services:
  nestjs-api:
    <<: *app
    command: ["sh", "-c", "npm run migration:run && npm run start:prod"]
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://nestjs-api:3000/"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      db: {condition: service_healthy}
      mailpit: {condition: service_started}
      storage-init: {condition: service_completed_successfully}
      queue: {condition: service_healthy}

  worker:
    <<: *app
    command: ["node", "dist/worker/main.js"]
    environment:
      DB_HOST: db
      REDIS_HOST: queue
      S3_ENDPOINT: http://storage:9000
      TMPDIR: /var/tmp/videos
    volumes: ["video-tmp:/var/tmp/videos"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    stop_grace_period: 125m
    depends_on:
      nestjs-api: {condition: service_healthy}
      db: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
      queue: {condition: service_healthy}
    restart: on-failure

  db:
    image: postgres:17
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: streamtube
      POSTGRES_PASSWORD: streamtube
      POSTGRES_DB: streamtube
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]

  queue:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-streamtube}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-streamtube-local-secret}
      MINIO_API_CORS_ALLOW_ORIGIN: ${UPLOAD_ALLOWED_ORIGIN:-http://localhost:3001}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://storage:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    env_file: .env
    entrypoint: ["/bin/sh", "/init/storage-init.sh"]
    volumes: ["./docker/storage-init.sh:/init/storage-init.sh:ro"]
    depends_on:
      storage: {condition: service_healthy}

  # Optional Codex PostgreSQL MCP sidecar, never started by default.
  mcp-postgres:
    image: node:22-bookworm-slim
    profiles: ["tools"]
    command: ["npx", "-y", "@modelcontextprotocol/server-postgres", "postgresql://streamtube:streamtube@db:5432/streamtube"]
    stdin_open: true
    depends_on:
      db: {condition: service_healthy}

volumes:
  postgres-data:
  redis-data:
  minio-data:
  video-tmp:
